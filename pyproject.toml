[project]
name = "python-demo"
version = "0.3.0"
description = "A colorful FastAPI server with rich logging and background traffic generation"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "Jared Thivener"}]

dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "rich==15.0.0",
    "httpx2==2.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Fail on deprecations so a library upgrade cannot quietly leave us on a deprecated API.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# PEP 8 (E, W), naming, pyupgrade, bugbear, simplify, and PEP 257 docstrings (D).
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Docstrings are required for the app and scripts, not for test functions.
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
